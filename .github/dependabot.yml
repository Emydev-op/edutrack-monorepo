version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # TypeScript 7.0 ships the native `tsc` only, without the compiler API that vue-tsc,
      # typescript-eslint and the Nest CLI load. 7.1 is expected to bring it back.
      - dependency-name: typescript
        versions: ['7.0.x']
    groups:
      vue:
        patterns:
          [
            'vue',
            'vue-*',
            '@vue/*',
            'pinia',
            '@tanstack/vue-query',
            'vee-validate',
            '@vee-validate/*',
          ]
      nestjs:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      tooling:
        patterns:
          [
            'eslint*',
            '@eslint/*',
            'oxlint*',
            'prettier',
            'typescript',
            'vite',
            'vitest',
            '@vitest/*',
          ]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
  - package-ecosystem: docker
    directories: ['/services/edutrack/*']
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(deps)'
