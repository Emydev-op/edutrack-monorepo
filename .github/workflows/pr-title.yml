name: PR title

# Feature PRs are squash-merged, so the PR title becomes the commit release-please reads.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            deps
          requireScope: false
          # Release PRs (release-please) and the dev → main / main → dev syncs are exempt.
          ignoreLabels: |
            autorelease: pending
            sync
