# The production router, baked into the single web image (infrastructure/docker/web.Dockerfile):
# every portal's built files, served by one nginx with the same routing as the local router
# (gateway.dev.conf), and /api forwarded to the API.
#
#   console.edutrack.ng                  back office
#   admin.edutrack.ng                    School Admin (school chosen at sign-in)
#   <school>.edutrack.ng                 the school's entry page
#   <school>.edutrack.ng/teacher/        Teacher Workspace
#   <school>.edutrack.ng/parent/         Parent portal
#   <school>.edutrack.ng/student/        Student portal
#   */api/                               the API (${API_UPSTREAM})
#
# The same names under .localhost also work, to try the image on your machine:
#   docker run -p 8080:80 -e API_UPSTREAM=http://host.docker.internal:8000 edutrack/web
#   then http://greenfield.localhost:8080
#
# ${API_UPSTREAM} is filled in when the container starts (the nginx image renders
# /etc/nginx/templates with envsubst, replacing only variables that are set). TLS (one wildcard
# certificate for *.edutrack.ng) ends at the load balancer in front; this listens on plain HTTP.
#
# Files: /usr/share/edutrack/backoffice, /school-admin, /school-home, and /portals/teacher,
# /portals/parent, /portals/student (those three are built for their path, e.g. base '/teacher/').

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# The scheme the visitor used, as reported by the load balancer (TLS ends there).
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
server_tokens off;

# Shared by every /api/ location: keep the address (the API reads the school from the Host),
# forward the client, allow WebSocket upgrades.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 120s;
client_max_body_size 25m;

# Anything else (an IP, an unknown domain): only the health check answers.
server {
  listen 80 default_server;
  server_name _;
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }
  location / { return 404; }
}

server {
  listen 80;
  server_name console.edutrack.ng console.localhost;
  root /usr/share/edutrack/backoffice;

  location /api/ { proxy_pass ${API_UPSTREAM}; }

  # Hashed build assets never change, so cache them for a year; index.html is always revalidated.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  server_name admin.edutrack.ng admin.localhost;
  root /usr/share/edutrack/school-admin;

  location /api/ { proxy_pass ${API_UPSTREAM}; }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}

# Any other <name>.edutrack.ng is a school. Exact names (console, admin) win over this pattern;
# other reserved names (www, api, …) reach the entry page, where the API answers SCHOOL_NOT_FOUND.
server {
  listen 80;
  server_name ~^[a-z0-9-]+\.edutrack\.ng$ ~^[a-z0-9-]+\.localhost$;

  location /api/ { proxy_pass ${API_UPSTREAM}; }

  # The portals: /teacher/anything falls back to /teacher/index.html, and so on.
  location = /teacher { return 301 /teacher/; }
  location = /parent { return 301 /parent/; }
  location = /student { return 301 /student/; }

  location ~ ^/(teacher|parent|student)/assets/ {
    root /usr/share/edutrack/portals;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  location ~ ^/(teacher|parent|student)/ {
    root /usr/share/edutrack/portals;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /$1/index.html;
  }

  # The school's entry page at the root of its address.
  location /assets/ {
    root /usr/share/edutrack/school-home;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  location / {
    root /usr/share/edutrack/school-home;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
