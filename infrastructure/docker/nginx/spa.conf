# Serves a built Vue portal at the root of its address. History-mode routes fall back to
# index.html. (Portals built for a path, like /teacher/, use spa-subpath.conf.template.)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  # A location with its own add_header drops the server's, so the security headers are repeated
  # in each one.

  # Hashed build assets never change, so cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri $uri/ /index.html;
  }
}
