# Local stand-in for the production router: the same addresses, ending in .localhost instead of
# .edutrack.ng, in front of the portals' dev servers (running on your Mac) and the API.
#
#   http://console.localhost              back office         (npm run dev:backoffice, :5170)
#   http://admin.localhost                School Admin        (npm run dev:school-admin, :5171)
#   http://greenfield.localhost           school entry page   (npm run dev:school-home, :5175)
#   http://greenfield.localhost/teacher   Teacher Workspace   (npm run dev:teacher, :5172)
#   http://greenfield.localhost/student   Student portal      (npm run dev:student, :5173)
#   http://greenfield.localhost/parent    Parent portal       (npm run dev:parent, :5174)
#   */api                                 the API             (npm run dev:backend, :8000)
#
# Browsers send *.localhost to this machine without any DNS or hosts-file changes. The Host
# header is passed through untouched, which is how the API knows which school an address is for.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# ${DEV_HOST} is your Mac's address as seen from the container, filled in at start-up (see the
# gateway service in docker-compose.yml).
upstream api { server ${DEV_HOST}:8000; }
upstream backoffice { server ${DEV_HOST}:5170; }
upstream school_admin { server ${DEV_HOST}:5171; }
upstream teacher { server ${DEV_HOST}:5172; }
upstream student { server ${DEV_HOST}:5173; }
upstream parent { server ${DEV_HOST}:5174; }
upstream school_home { server ${DEV_HOST}:5175; }

# Shared by every location below: keep the address, forward the client, allow Vite's live reload.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 1h;
client_max_body_size 25m;

server {
  listen 80 default_server;
  server_name localhost;
  default_type text/plain;
  location = /healthz { return 200 'ok'; }
  location / {
    return 200 "EduTrack local router\n\nhttp://console.localhost            back office\nhttp://admin.localhost              School Admin\nhttp://greenfield.localhost         a school's entry page\nhttp://greenfield.localhost/teacher Teacher Workspace\n";
  }
}

server {
  listen 80;
  server_name console.localhost;
  location /api/ { proxy_pass http://api; }
  location / { proxy_pass http://backoffice; }
}

server {
  listen 80;
  server_name admin.localhost;
  location /api/ { proxy_pass http://api; }
  location / { proxy_pass http://school_admin; }
}

# Any other <name>.localhost is a school (the API answers SCHOOL_NOT_FOUND for unknown names).
server {
  listen 80;
  server_name ~^[a-z0-9-]+\.localhost$;
  location /api/ { proxy_pass http://api; }
  location = /teacher { return 301 /teacher/; }
  location /teacher/ { proxy_pass http://teacher; }
  location = /student { return 301 /student/; }
  location /student/ { proxy_pass http://student; }
  location = /parent { return 301 /parent/; }
  location /parent/ { proxy_pass http://parent; }
  location / { proxy_pass http://school_home; }
}
