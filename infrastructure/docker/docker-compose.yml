# Local backing services for development (Postgres, Redis, S3 storage, Mailpit). Start with `npm run infra:up` from the repo root.
# Credentials match services/edutrack/backend/.env.example and are for local use only.
name: edutrack

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: edutrack
      POSTGRES_PASSWORD: edutrack
      POSTGRES_DB: edutrack
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U edutrack -d edutrack']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. API on :9000, web console on :9001.
  storage:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: edutrack
      RUSTFS_SECRET_KEY: edutrack-secret
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage-data:/data

  # Catches every email the API sends locally. SMTP on :1025, inbox UI on :8025.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  # The local router: console.localhost, admin.localhost and <school>.localhost/teacher|parent|student
  # in front of the dev servers on your Mac (see nginx/gateway.dev.conf). Port 80 by default; set
  # GATEWAY_PORT=8080 if something else uses 80, then open http://greenfield.localhost:8080.
  gateway:
    # Rebuilt by `npm run infra:up` when gateway.dev.conf changes.
    build:
      context: ./nginx
      dockerfile: gateway.dev.Dockerfile
    restart: unless-stopped
    ports:
      - '${GATEWAY_PORT:-80}:80'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  storage-data:
